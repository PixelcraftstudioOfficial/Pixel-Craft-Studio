<!-- --- UPDATED FIREBASE INTEGRATION SCRIPT FOR CONTACT US.HTML --- -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDeB7_uqC-sk3fbNyMZmWe8wZjrbYvyBrY",
  authDomain: "pixel-craft-c6717.firebaseapp.com",
  projectId: "pixel-craft-c6717",
  storageBucket: "pixel-craft-c6717.firebasestorage.app",
  messagingSenderId: "540712193494",
  appId: "1:540712193494:web:79afc5be7a96ece0b12877",
  measurementId: "G-TNNHDKSQDT"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let generatedOrderId = "";

document.getElementById('projectForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.innerText = 'Creating Order Number...';
    btn.disabled = true;

    // Generate Easy 4-Digit Order Number (e.g. PCS-4829)
    const randomNum = Math.floor(1000 + Math.random() * 9000);
    const easyOrderId = `PCS-${randomNum}`;

    try {
        await setDoc(doc(db, "orders", easyOrderId), {
            orderNo: easyOrderId,
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value || 'Not provided',
            business: document.getElementById('business').value || 'Not provided',
            service: document.getElementById('service').value,
            client_budget: document.getElementById('budget').value,
            message: document.getElementById('message').value,
            status: 'reviewed',
            assignee: 'Unassigned',
            budget: 0,
            advance: 0,
            timeline: "To be decided",
            samples: [],
            finalLink: "",
            createdAt: serverTimestamp()
        });

        generatedOrderId = easyOrderId;

        document.getElementById('form-box').style.display = 'none';
        document.getElementById('display-order-id').innerText = generatedOrderId;
        document.getElementById('success-box').style.display = 'block';

    } catch(error) {
        console.error("Error writing document: ", error);
        alert("Error submitting your request. Please check your connection and try again.");
        btn.innerText = 'Submit Project Request';
        btn.disabled = false;
    }
});

window.notifyWhatsApp = function() {
    if(!generatedOrderId) return;
    const msg = encodeURIComponent(`Hi Pixel Craft Studio, I just submitted a project request.\n\nMy Order No is: *${generatedOrderId}*\nPlease review and update my Customer Portal.`);
    window.open(`https://wa.me/94766390768?text=${msg}`, '_blank');
}
</script>
