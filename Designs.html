<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #333;
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .design-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        
        .design-card:hover {
            transform: translateY(-5px);
        }
        
        .design-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        
        .design-info {
            padding: 15px;
            text-align: center;
        }
        
        .design-info h3 {
            color: #333;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <h1>Our Designs</h1>
    
    <div class="gallery">
        <div class="design-card">
            <img src="Image 1.jpg" alt="Design 1">
            <div class="design-info"><h3>Our Post</h3></div>
        </div>
        <div class="design-card">
            <img src="Image 2.jpg" alt="Design 2">
            <div class="design-info"><h3>Banner</h3></div>
        </div>
        <div class="design-card">
            <img src="Image 3.jpg" alt="Design 3">
            <div class="design-info"><h3>Social Media Post</h3></div>
        </div>
        <div class="design-card">
            <img src="Image 4.jpg" alt="Design 4">
            <div class="design-info"><h3>Banner</h3></div>
        </div>
        <div class="design-card">
            <img src="Image 5.jpg" alt="Design 5">
            <div class="design-info"><h3>Banner Design</h3></div>
        </div>
        <div class="design-card">
            <img src="Image 6.png" alt="Design 6">
            <div class="design-info"><h3>Scial Media Post</h3></div>
        </div>

    </div>
</body>
</html>
