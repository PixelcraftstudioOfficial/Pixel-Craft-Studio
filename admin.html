<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Pixel Craft Studio</title>
    <link rel="icon" type="image/png" href="Favicon.png">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Pure Vector PDF Engine (jsPDF & AutoTable - Never Clips or Cuts Off!) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --primary: #3b82f6;
            --secondary: #8b5cf6;
            --bg-deep: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-deep); color: var(--text-main); }

        #login-screen { position: fixed; width: 100%; height: 100vh; background: var(--bg-deep); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .login-box { background: var(--card-bg); padding: 40px; border-radius: 12px; border: 1px solid var(--border); text-align: center; width: 350px; }
        .login-box input { padding: 12px; width: 100%; margin: 12px 0; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-deep); color: #fff; }
        .btn { padding: 10px 18px; border: none; border-radius: 6px; background: var(--primary); color: white; cursor: pointer; font-weight: 600; width: 100%; transition: 0.3s; }
        .btn:hover { background: #2563eb; }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }

        #dashboard { display: none; padding: 30px; max-width: 1350px; margin: 0 auto; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        
        .analytics-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-bottom: 30px; }
        @media (max-width: 800px) { .analytics-grid { grid-template-columns: 1fr; } }
        .stats-col { display: flex; flex-direction: column; gap: 15px; }
        .stat-card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        .stat-card h3 { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 5px; }
        .stat-card .value { font-size: 1.8rem; font-weight: 700; }
        .chart-card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); height: 260px; }

        .controls { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .controls input, .controls select { padding: 10px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--card-bg); color: white; }
        .controls input { flex: 1; min-width: 220px; }

        .table-container { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); overflow-x: auto; padding: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        th { color: var(--text-muted); font-weight: 600; }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; display: inline-block; }
        .b-reviewed { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .b-awaiting { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .b-progress { background: rgba(6, 182, 212, 0.2); color: #22d3ee; }
        .b-sample { background: rgba(139, 92, 246, 0.2); color: #c084fc; }
        .b-completed { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        
        .action-btn { padding: 6px 12px; font-size: 0.8rem; cursor: pointer; border-radius: 6px; border: 1px solid var(--primary); background: rgba(59, 130, 246, 0.1); color: #60a5fa; font-weight: 600; }
        .action-btn:hover { background: var(--primary); color: #fff; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.82); justify-content: center; align-items: center; z-index: 200; padding: 15px; }
        .modal-content { background: var(--card-bg); padding: 28px; border-radius: 14px; width: 100%; max-width: 940px; border: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; gap: 25px; max-height: 94vh; overflow-y: auto; }
        @media (max-width: 750px) { .modal-content { grid-template-columns: 1fr; } .modal-header, .modal-actions { grid-column: span 1 !important; } }
        .modal-header { grid-column: span 2; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        .close-modal { cursor: pointer; color: var(--text-muted); font-size: 1.5rem; font-weight: bold; }
        
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.82rem; color: var(--text-muted); font-weight: 500; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-deep); color: white; font-size: 0.9rem; }
        .form-group textarea { height: 65px; resize: vertical; }

        /* Advance Paid Toggle Box */
        .payment-toggle-box {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.35);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .payment-toggle-box label {
            margin: 0;
            color: #34d399;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .payment-toggle-box input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #10b981;
            cursor: pointer;
        }
        .live-balance-pill {
            background: rgba(0,0,0,0.4);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--warning);
        }

        .client-refs-box { display: flex; gap: 10px; flex-wrap: wrap; background: var(--bg-deep); padding: 10px; border-radius: 8px; border: 1px solid var(--border); min-height: 55px; align-items: center; }
        .client-ref-thumb { width: 75px; text-align: center; }
        .client-ref-thumb img { width: 75px; height: 52px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); display: block; margin-bottom: 4px; }
        .client-ref-thumb a { font-size: 0.72rem; color: #60a5fa; text-decoration: none; font-weight: 600; }

        .log-box { background: var(--bg-deep); padding: 10px; border-radius: 6px; height: 80px; overflow-y: auto; font-size: 0.78rem; border: 1px solid var(--border); }
        .log-entry { margin-bottom: 5px; color: var(--text-muted); border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 4px; }
        .log-entry span { color: var(--primary); font-weight: 600; }

        .modal-actions { grid-column: span 2; display: flex; gap: 12px; border-top: 1px solid var(--border); padding-top: 18px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2 style="margin-bottom: 15px;">Agency Admin Portal</h2>
            <input type="email" id="admin-email" placeholder="Admin Email">
            <input type="password" id="admin-pass" placeholder="Password">
            <button class="btn" onclick="loginAdmin()" id="loginBtn">Secure Login</button>
            <p id="login-err" style="color: var(--danger); margin-top: 15px; display: none; font-size: 0.85rem;">Login Failed. Check credentials.</p>
        </div>
    </div>

    <div id="dashboard">
        <div class="header-bar">
            <h2>Admin Dashboard <span id="current-user" style="font-size:0.9rem; color:var(--text-muted); font-weight:normal; margin-left:8px;"></span></h2>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button class="btn" style="width:auto; background: var(--success);" onclick="openNewOrderModal()">+ Create Manual Order</button>
                <button class="btn btn-outline" style="width:auto;" onclick="loadData()">↻ Refresh</button>
                <button class="btn" style="width:auto; background:var(--danger);" onclick="logoutAdmin()">Logout</button>
            </div>
        </div>

        <div class="analytics-grid">
            <div class="stats-col">
                <div class="stat-card"><h3>Total Orders</h3><div class="value" id="stat-total">0</div></div>
                <div class="stat-card"><h3>Awaiting Advance / Action</h3><div class="value" id="stat-pending" style="color:var(--warning);">0</div></div>
                <div class="stat-card"><h3>Total Project Value</h3><div class="value" id="stat-revenue" style="color:var(--success);">Rs. 0</div></div>
            </div>
            <div class="chart-card">
                <canvas id="statusChart"></canvas>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search by Order No (PCS-XXXX), Client Name or Phone..." onkeyup="filterTable()">
            <select id="statusFilter" onchange="filterTable()">
                <option value="ALL">All Statuses</option>
                <option value="reviewed">Reviewed</option>
                <option value="awaiting_advance">Awaiting Advance</option>
                <option value="in_progress">In Progress</option>
                <option value="sample_ready">Sample Ready</option>
                <option value="completed">Completed</option>
            </select>
            <select id="teamFilter" onchange="filterTable()">
                <option value="ALL">All Partners (4)</option>
                <option value="Unassigned">Unassigned</option>
                <option value="Lakmal">Lakmal (Tech & Creative)</option>
                <option value="Pasindu">Pasindu (Sales & Client)</option>
                <option value="Shane">Shane (Finance & Admin)</option>
                <option value="Nayanajith">Nayanajith (Operations)</option>
            </select>
        </div>

        <div class="table-container">
            <table id="ordersTable">
                <thead>
                    <tr>
                        <th>Order No</th>
                        <th>Client Details</th>
                        <th>Service</th>
                        <th>Status</th>
                        <th>Partner Assigned</th>
                        <th>Total / Balance</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="7" style="text-align: center;">Loading orders...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Manage Order Modal -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="m-title">Manage Order</h3>
                <span class="close-modal" onclick="closeModal()">✕</span>
            </div>
            
            <!-- Left Column -->
            <div>
                <input type="hidden" id="m-id">
                <div class="form-group">
                    <label>Client Description & Reference Photos</label>
                    <div id="m-client-msg" style="background:var(--bg-deep); padding:8px 10px; border-radius:6px; font-size:0.82rem; color:var(--text-main); margin-bottom:8px; border:1px solid var(--border);"></div>
                    <div class="client-refs-box" id="m-client-refs"></div>
                </div>
                <div class="form-group">
                    <label>Assign To Partner</label>
                    <select id="m-assignee">
                        <option value="Unassigned">Unassigned</option>
                        <option value="Lakmal">Lakmal (Creative & Tech Lead)</option>
                        <option value="Pasindu">Pasindu (Sales & Client Lead)</option>
                        <option value="Shane">Shane (Finance & Admin Lead)</option>
                        <option value="Nayanajith">Nayanajith (Operations Lead)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Project Status</label>
                    <select id="m-status" onchange="calcLiveBalance()">
                        <option value="reviewed">1. Reviewed (Pending Quote)</option>
                        <option value="awaiting_advance">2. Awaiting Advance</option>
                        <option value="in_progress">3. In Progress</option>
                        <option value="sample_ready">4. Sample Ready for Client</option>
                        <option value="completed">5. Completed (Unlocks Final File)</option>
                    </select>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex:1;">
                        <label>Total Budget (Rs)</label>
                        <input type="number" id="m-budget" oninput="calcLiveBalance()">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>Advance Amount (Rs)</label>
                        <input type="number" id="m-advance" oninput="calcLiveBalance()">
                    </div>
                </div>

                <!-- NEW: Advance Paid Checkbox with Auto Balance Calculation -->
                <div class="payment-toggle-box">
                    <label>
                        <input type="checkbox" id="m-advance-paid" onchange="calcLiveBalance()">
                        ✅ Advance Payment Received (Paid)
                    </label>
                    <div class="live-balance-pill" id="m-live-balance">Balance: Rs. 0</div>
                </div>

                <div class="form-group">
                    <label>Timeline</label>
                    <input type="text" id="m-timeline" placeholder="e.g. 3-5 Business Days">
                </div>
            </div>

            <!-- Right Column -->
            <div>
                <div class="form-group">
                    <label>🎨 Sample / Watermarked Preview URLs (Comma separated links)</label>
                    <textarea id="m-samples" placeholder="Paste Cloudinary image links or Google Drive preview links separated by commas..."></textarea>
                </div>
                <div class="form-group">
                    <label>📦 Final Project Delivery Link (Google Drive / ZIP / Website URL)</label>
                    <input type="text" id="m-final-link" placeholder="https://drive.google.com/...">
                </div>
                <div class="form-group">
                    <label>Internal Team Notes / Custom Invoice Description</label>
                    <textarea id="m-notes" placeholder="Notes for team..."></textarea>
                </div>
                <div class="form-group">
                    <label>Activity Log</label>
                    <div class="log-box" id="m-log"></div>
                </div>

                <!-- Separate Quotation & Official Invoice Buttons -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;">
                    <button class="btn" style="background: #0ea5e9;" onclick="generateVectorDocument('QUOTATION')">📋 Download Quotation</button>
                    <button class="btn" style="background: #8b5cf6;" onclick="generateVectorDocument('INVOICE')">🧾 Download Official Invoice</button>
                </div>
                <button class="btn btn-outline" style="margin-top: 10px;" onclick="copyClientLink()">🔗 Copy Client Portal Link</button>
            </div>

            <div class="modal-actions">
                <button class="btn" onclick="saveOrderUpdates()" id="saveBtn" style="flex:2;">💾 Save Order & Update Portal</button>
                <button class="btn btn-outline" style="flex:1; border-color:#25D366; color:#25D366;" onclick="waManual()">💬 Send Update on WhatsApp</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, setDoc, updateDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDeB7_uqC-sk3fbNyMZmWe8wZjrbYvyBrY",
            authDomain: "pixel-craft-c6717.firebaseapp.com",
            projectId: "pixel-craft-c6717",
            storageBucket: "pixel-craft-c6717.firebasestorage.app",
            messagingSenderId: "540712193494",
            appId: "1:540712193494:web:79afc5be7a96ece0b12877",
            measurementId: "G-TNNHDKSQDT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.allOrders = [];
        window.currentUser = null;
        let myChart = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.currentUser = user.email;
                document.getElementById('current-user').innerText = `(${user.email})`;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadData();
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('dashboard').style.display = 'none';
            }
        });

        window.loginAdmin = async function() {
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-pass').value;
            const btn = document.getElementById('loginBtn');
            btn.innerText = "Verifying...";
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (error) {
                document.getElementById('login-err').style.display = 'block';
                btn.innerText = "Secure Login";
            }
        }

        window.logoutAdmin = function() { signOut(auth); }

        window.loadData = async function() {
            const tBody = document.getElementById('table-body');
            try {
                const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
                const snapshot = await getDocs(q);
                
                window.allOrders = [];
                let stats = { total: 0, pending: 0, rev: 0, s_rev: 0, s_adv: 0, s_prog: 0, s_samp: 0, s_comp: 0 };
                
                snapshot.forEach(docSnap => {
                    let d = docSnap.data();
                    d.id = docSnap.id;
                    window.allOrders.push(d);
                    
                    stats.total++;
                    stats.rev += Number(d.budget || 0);
                    if(d.status === 'awaiting_advance' || d.status === 'reviewed') stats.pending++;
                    
                    if(d.status === 'reviewed') stats.s_rev++;
                    else if(d.status === 'awaiting_advance') stats.s_adv++;
                    else if(d.status === 'in_progress') stats.s_prog++;
                    else if(d.status === 'sample_ready') stats.s_samp++;
                    else if(d.status === 'completed') stats.s_comp++;
                });

                document.getElementById('stat-total').innerText = stats.total;
                document.getElementById('stat-pending').innerText = stats.pending;
                document.getElementById('stat-revenue').innerText = `Rs. ${stats.rev.toLocaleString()}`;

                renderTable(window.allOrders);
                renderChart(stats);
            } catch (err) {
                console.error(err);
                tBody.innerHTML = `<tr><td colspan="7">Error loading data.</td></tr>`;
            }
        }

        function renderTable(dataArray) {
            const tBody = document.getElementById('table-body');
            let html = '';
            dataArray.forEach(d => {
                let sClass = 'b-reviewed', sText = 'Reviewed';
                if(d.status === 'awaiting_advance') { sClass = 'b-awaiting'; sText = 'Awaiting Adv.'; }
                if(d.status === 'in_progress') { sClass = 'b-progress'; sText = 'In Progress'; }
                if(d.status === 'sample_ready') { sClass = 'b-sample'; sText = 'Sample Ready'; }
                if(d.status === 'completed') { sClass = 'b-completed'; sText = 'Completed'; }

                let assignee = d.assignee || 'Unassigned';
                let orderNo = d.orderNo || d.id;
                let hasImgs = (d.clientImages && d.clientImages.length > 0) ? `<span style="color:#10b981; font-size:0.75rem;">📷 (${d.clientImages.length})</span>` : '';

                let totalB = Number(d.budget || 0);
                let advB = Number(d.advance || 0);
                let balB = d.advancePaid ? Math.max(0, totalB - advB) : totalB;
                if (d.status === 'completed') balB = 0;

                let advTag = d.advancePaid ? `<br><span style="color:#10b981; font-size:0.75rem;">✓ Adv. Paid (Bal: Rs. ${balB.toLocaleString()})</span>` : '';

                html += `
                    <tr class="order-row" data-orderno="${orderNo.toLowerCase()}" data-name="${(d.name||'').toLowerCase()}" data-phone="${d.phone||''}" data-status="${d.status}" data-team="${assignee}">
                        <td><strong style="color:#60a5fa;">${orderNo}</strong> ${hasImgs}</td>
                        <td><strong>${d.name}</strong><br><span style="font-size:0.8rem; color:var(--text-muted);">${d.business || d.phone || ''}</span></td>
                        <td>${d.service}</td>
                        <td><span class="badge ${sClass}">${sText}</span></td>
                        <td>${assignee}</td>
                        <td><strong>Rs. ${totalB.toLocaleString()}</strong>${advTag}</td>
                        <td><button class="action-btn" onclick="openOrderModal('${d.id}')">Manage</button></td>
                    </tr>
                `;
            });
            tBody.innerHTML = html || '<tr><td colspan="7" style="text-align:center;">No orders found.</td></tr>';
        }

        function renderChart(stats) {
            const ctx = document.getElementById('statusChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Reviewed', 'Awaiting Adv', 'In Progress', 'Sample Ready', 'Completed'],
                    datasets: [{
                        label: 'Orders',
                        data: [stats.s_rev, stats.s_adv, stats.s_prog, stats.s_samp, stats.s_comp],
                        backgroundColor: ['#60a5fa', '#fbbf24', '#22d3ee', '#c084fc', '#34d399'],
                        borderRadius: 6
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        window.openOrderModal = function(id) {
            const order = window.allOrders.find(o => o.id === id);
            if(!order) return;

            document.getElementById('m-id').value = id;
            document.getElementById('m-title').innerText = `Order ${order.orderNo || id} - ${order.name}`;
            document.getElementById('m-client-msg').innerText = order.message || "No description provided.";
            document.getElementById('m-assignee').value = order.assignee || 'Unassigned';
            document.getElementById('m-status').value = order.status || 'reviewed';
            document.getElementById('m-budget').value = order.budget || 0;
            document.getElementById('m-advance').value = order.advance || 0;
            document.getElementById('m-advance-paid').checked = Boolean(order.advancePaid);
            document.getElementById('m-timeline').value = order.timeline || '';
            document.getElementById('m-notes').value = order.internal_notes || '';
            document.getElementById('m-samples').value = Array.isArray(order.samples) ? order.samples.join(', ') : (order.samples || '');
            document.getElementById('m-final-link').value = order.finalLink || '';

            calcLiveBalance();

            const refsBox = document.getElementById('m-client-refs');
            refsBox.innerHTML = '';
            if (order.clientImages && order.clientImages.length > 0) {
                order.clientImages.forEach((imgData, idx) => {
                    refsBox.innerHTML += `
                        <div class="client-ref-thumb">
                            <img src="${imgData}" alt="Ref ${idx+1}">
                            <a href="${imgData}" download="Ref_${order.orderNo || id}_${idx+1}.jpg">⬇ Save #${idx+1}</a>
                        </div>
                    `;
                });
            } else {
                refsBox.innerHTML = '<span style="font-size:0.8rem; color:var(--text-muted);">No reference photos uploaded by client.</span>';
            }

            const logBox = document.getElementById('m-log');
            logBox.innerHTML = '';
            if(order.logs && order.logs.length > 0) {
                order.logs.forEach(l => {
                    logBox.innerHTML += `<div class="log-entry"><span>[${l.date}]</span> ${l.msg}</div>`;
                });
            } else {
                logBox.innerHTML = '<div class="log-entry">No activity recorded yet.</div>';
            }

            document.getElementById('orderModal').style.display = 'flex';
        }

        window.closeModal = function() { document.getElementById('orderModal').style.display = 'none'; }

        window.saveOrderUpdates = async function() {
            const btn = document.getElementById('saveBtn');
            btn.innerText = "Saving...";
            
            const id = document.getElementById('m-id').value;
            const order = window.allOrders.find(o => o.id === id);
            
            const rawSamples = document.getElementById('m-samples').value;
            const sampleArray = rawSamples.split(',').map(s => s.trim()).filter(Boolean);
            const isAdvPaid = document.getElementById('m-advance-paid').checked;

            const updates = {
                assignee: document.getElementById('m-assignee').value,
                status: document.getElementById('m-status').value,
                budget: Number(document.getElementById('m-budget').value),
                advance: Number(document.getElementById('m-advance').value),
                advancePaid: isAdvPaid,
                timeline: document.getElementById('m-timeline').value,
                internal_notes: document.getElementById('m-notes').value,
                samples: sampleArray,
                finalLink: document.getElementById('m-final-link').value.trim()
            };

            const d = new Date();
            const logStr = `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
            const userShort = window.currentUser ? window.currentUser.split('@')[0] : 'Admin';
            const advNote = isAdvPaid ? ' [Adv. Paid]' : '';
            const newLogs = order.logs ? [...order.logs, {date: logStr, msg: `${updates.status}${advNote} (${userShort})`}] : [{date: logStr, msg: `Updated by ${userShort}`}];
            updates.logs = newLogs;

            try {
                await updateDoc(doc(db, "orders", id), updates);
                alert("Order & Customer Portal Updated Successfully!");
                closeModal();
                loadData();
            } catch (e) {
                console.error(e);
                alert("Error saving data.");
            }
            btn.innerText = "💾 Save Order & Update Portal";
        }

        window.openNewOrderModal = async function() {
            const name = prompt("Enter Client Name:");
            if (!name) return;
            const phone = prompt("Enter Client WhatsApp / Phone Number:");
            const service = prompt("Enter Service / Package Name:", "Business Starter Kit (Rs. 7,500)");
            const budget = Number(prompt("Enter Total Budget (Rs):", "7500")) || 0;
            const advance = Number(prompt("Enter Required Advance (Rs):", "3500")) || 0;

            const randomDigits = Math.floor(1000 + Math.random() * 9000);
            const easyOrderNo = `PCS-${randomDigits}`;

            try {
                await setDoc(doc(db, "orders", easyOrderNo), {
                    orderNo: easyOrderNo,
                    name: name,
                    phone: phone || 'Not provided',
                    business: '',
                    service: service || 'Custom Project',
                    status: 'awaiting_advance',
                    assignee: 'Unassigned',
                    budget: budget,
                    advance: advance,
                    advancePaid: false,
                    timeline: '3-5 Business Days',
                    clientImages: [],
                    samples: [],
                    finalLink: '',
                    createdAt: serverTimestamp()
                });
                alert(`New Order Created!\nOrder No: ${easyOrderNo}`);
                loadData();
            } catch (e) {
                alert("Error creating manual order.");
            }
        }
    </script>

    <script>
        function calcLiveBalance() {
            const budget = Number(document.getElementById('m-budget').value || 0);
            const advance = Number(document.getElementById('m-advance').value || 0);
            const advPaid = document.getElementById('m-advance-paid').checked;
            const status = document.getElementById('m-status').value;

            // If advancePaid is checked and status is still awaiting_advance, auto-suggest in_progress
            if (advPaid && status === 'awaiting_advance') {
                document.getElementById('m-status').value = 'in_progress';
            }

            let balance = advPaid ? Math.max(0, budget - advance) : budget;
            if (document.getElementById('m-status').value === 'completed') {
                balance = 0;
            }

            const pill = document.getElementById('m-live-balance');
            pill.innerText = `Balance Due: Rs. ${balance.toLocaleString()}`;
            pill.style.color = balance === 0 ? '#10b981' : '#fbbf24';
        }

        function filterTable() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const sFilter = document.getElementById('statusFilter').value;
            const tFilter = document.getElementById('teamFilter').value;
            const rows = document.querySelectorAll('.order-row');

            rows.forEach(row => {
                const orderno = row.getAttribute('data-orderno');
                const name = row.getAttribute('data-name');
                const phone = row.getAttribute('data-phone');
                const stat = row.getAttribute('data-status');
                const team = row.getAttribute('data-team');

                let matchText = orderno.includes(term) || name.includes(term) || phone.includes(term);
                let matchStat = sFilter === 'ALL' || stat === sFilter;
                let matchTeam = tFilter === 'ALL' || team === tFilter;

                row.style.display = (matchText && matchStat && matchTeam) ? '' : 'none';
            });
        }

        function copyClientLink() {
            const id = document.getElementById('m-id').value;
            let baseUrl = window.location.href.split('admin.html')[0];
            let link = baseUrl + 'portal.html?id=' + id;
            navigator.clipboard.writeText(link);
            alert("Portal Link Copied!\nOrder No: " + id + "\n\n" + link);
        }

        function waManual() {
            const id = document.getElementById('m-id').value;
            const order = window.allOrders.find(o => o.id === id);
            let waNum = (order.phone || '').replace(/[^0-9]/g, '');
            if(waNum.startsWith('0')) waNum = '94' + waNum.substring(1);
            let baseUrl = window.location.href.split('admin.html')[0];
            let link = baseUrl + 'portal.html?id=' + id;
            const msg = encodeURIComponent(`Hi ${order.name},\n\nYour project with Pixel Craft Studio has been updated!\n\n*Order No:* ${order.orderNo || id}\n*Track Live & View Samples:* ${link}`);
            window.open(`https://wa.me/${waNum}?text=${msg}`, '_blank');
        }

        // --- NEXT-LEVEL VECTOR PDF GENERATOR (QUOTATION & OFFICIAL INVOICE) ---
        function generateVectorDocument(docType) {
            const id = document.getElementById('m-id').value;
            const order = window.allOrders.find(o => o.id === id);
            if (!order) return;

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });

            // Read live values from Modal inputs so Admin doesn't even have to close modal first
            const displayId = (order.orderNo || id).toUpperCase();
            const clientName = order.name || 'Valued Client';
            const clientBiz = order.business && order.business !== 'Not provided' ? order.business : '';
            const clientPhone = order.phone && order.phone !== 'Not provided' ? order.phone : '';
            const serviceName = order.service || 'Digital & Creative Services';
            const timeline = document.getElementById('m-timeline').value || '3-5 Business Days';
            const totalBudget = Number(document.getElementById('m-budget').value || 0);
            const advanceAmt = Number(document.getElementById('m-advance').value || 0);
            const isAdvPaid = document.getElementById('m-advance-paid').checked;
            const currentStatus = document.getElementById('m-status').value;

            // Dates: Issue Date & Due Date (+7 Days)
            const issueDate = new Date();
            const dueDate = new Date();
            dueDate.setDate(issueDate.getDate() + 7);

            const formatDate = (d) => `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
            const issueDateStr = formatDate(issueDate);
            const dueDateStr = formatDate(dueDate);

            const isQuote = (docType === 'QUOTATION');

            // 1. Top Corporate Navy Banner
            doc.setFillColor(15, 23, 42); // #0f172a
            doc.rect(0, 0, 210, 44, 'F');

            // Accent Strip under Banner
            if (isQuote) {
                doc.setFillColor(14, 165, 233); // Cyan/Blue for Quotation
            } else {
                doc.setFillColor(59, 130, 246); // Royal Blue for Invoice
            }
            doc.rect(0, 44, 210, 2.5, 'F');

            // Brand Name (Left)
            doc.setTextColor(255, 255, 255);
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(22);
            doc.text('PIXEL CRAFT STUDIO', 15, 20);

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(9.5);
            doc.setTextColor(148, 163, 184);
            doc.text('Digital, Media & Web Solutions  |  A QuadraLK Venture', 15, 27);
            doc.text('Phone / WhatsApp: +94 76 639 0768  |  Kandy, Sri Lanka', 15, 33);

            // Document Title Badge (Right)
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(20);
            doc.setTextColor(255, 255, 255);
            doc.text(isQuote ? 'QUOTATION' : 'OFFICIAL INVOICE', 195, 20, { align: 'right' });

            doc.setFontSize(10);
            doc.setTextColor(96, 165, 250);
            doc.text(`Order No: ${displayId}`, 195, 28, { align: 'right' });

            // Payment Status Stamp on Header
            let statusStamp = 'PAYMENT PENDING';
            let stampColor = [245, 158, 11]; // Amber
            if (isQuote) {
                statusStamp = 'OFFICIAL ESTIMATE';
                stampColor = [56, 189, 248];
            } else if (currentStatus === 'completed' || (isAdvPaid && totalBudget - advanceAmt <= 0)) {
                statusStamp = 'PAID IN FULL';
                stampColor = [16, 185, 129]; // Green
            } else if (isAdvPaid) {
                statusStamp = 'ADVANCE PAID';
                stampColor = [16, 185, 129];
            }
            doc.setFontSize(9);
            doc.setTextColor(stampColor[0], stampColor[1], stampColor[2]);
            doc.text(statusStamp, 195, 35, { align: 'right' });

            // 2. Client Info (Left) & Dates Info Box (Right)
            doc.setFillColor(248, 250, 252);
            doc.setDrawColor(226, 232, 240);
            doc.roundedRect(15, 55, 95, 34, 2, 2, 'FD');
            doc.roundedRect(115, 55, 80, 34, 2, 2, 'FD');

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(8.5);
            doc.setTextColor(100, 116, 139);
            doc.text(isQuote ? 'PREPARED FOR (CLIENT):' : 'BILLED TO (CLIENT):', 20, 62);

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(12);
            doc.setTextColor(15, 23, 42);
            doc.text(clientName.substring(0, 32), 20, 69);

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(9.5);
            doc.setTextColor(71, 85, 105);
            if (clientBiz) doc.text(clientBiz.substring(0, 36), 20, 75);
            if (clientPhone) doc.text(`Tel: ${clientPhone}`, 20, clientBiz ? 81 : 75);

            // Right Box: Dates & Reference
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(9);
            doc.setTextColor(71, 85, 105);
            doc.text(isQuote ? 'Quotation Date:' : 'Invoice Date:', 120, 63);
            doc.text(isQuote ? 'Valid Until (7 Days):' : 'Due Date (7 Days):', 120, 71);
            doc.text('Portal Tracking ID:', 120, 79);

            doc.setFont('helvetica', 'bold');
            doc.setTextColor(15, 23, 42);
            doc.text(issueDateStr, 190, 63, { align: 'right' });
            doc.setTextColor(220, 38, 38); // Red highlight for Due Date
            doc.text(dueDateStr, 190, 71, { align: 'right' });
            doc.setTextColor(37, 99, 235);
            doc.text(displayId, 190, 79, { align: 'right' });

            // 3. Line Items Table using AutoTable
            doc.autoTable({
                startY: 97,
                margin: { left: 15, right: 15 },
                head: [['#', 'Service Description & Deliverables', 'Est. Timeline', 'Amount (LKR)']],
                body: [
                    [
                        '01',
                        `${serviceName}\nCustom digital production, quality assurance & portal delivery`,
                        timeline,
                        `Rs. ${totalBudget.toLocaleString('en-US', { minimumFractionDigits: 2 })}`
                    ]
                ],
                theme: 'grid',
                headStyles: {
                    fillColor: [15, 23, 42],
                    textColor: [255, 255, 255],
                    fontStyle: 'bold',
                    fontSize: 9.5,
                    cellPadding: 4
                },
                bodyStyles: {
                    textColor: [30, 41, 59],
                    fontSize: 9.5,
                    cellPadding: 5
                },
                columnStyles: {
                    0: { cellWidth: 12, halign: 'center' },
                    1: { cellWidth: 98 },
                    2: { cellWidth: 35, halign: 'center' },
                    3: { cellWidth: 35, halign: 'right', fontStyle: 'bold' }
                }
            });

            let finalY = doc.lastAutoTable.finalY + 10;

            // 4. Financial Calculation Summary Box (Right Side)
            const summaryX = 115;
            doc.setFillColor(248, 250, 252);
            doc.setDrawColor(203, 213, 225);
            doc.roundedRect(summaryX, finalY, 80, 42, 2, 2, 'FD');

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(9.5);
            doc.setTextColor(71, 85, 105);
            doc.text('Total Project Amount:', summaryX + 5, finalY + 10);
            doc.setFont('helvetica', 'bold');
            doc.setTextColor(15, 23, 42);
            doc.text(`Rs. ${totalBudget.toLocaleString('en-US', { minimumFractionDigits: 2 })}`, 190, finalY + 10, { align: 'right' });

            if (isQuote) {
                // Quotation shows Required Advance to Start
                doc.setFont('helvetica', 'normal');
                doc.setTextColor(71, 85, 105);
                doc.text('Advance Required to Start:', summaryX + 5, finalY + 19);
                doc.setFont('helvetica', 'bold');
                doc.setTextColor(217, 119, 6);
                doc.text(`Rs. ${advanceAmt.toLocaleString('en-US', { minimumFractionDigits: 2 })}`, 190, finalY + 19, { align: 'right' });

                const balOnCompletion = Math.max(0, totalBudget - advanceAmt);
                doc.setDrawColor(203, 213, 225);
                doc.line(summaryX + 5, finalY + 25, 190, finalY + 25);

                doc.setFontSize(10.5);
                doc.setTextColor(15, 23, 42);
                doc.text('Balance on Completion:', summaryX + 5, finalY + 34);
                doc.setTextColor(37, 99, 235);
                doc.text(`Rs. ${balOnCompletion.toLocaleString('en-US', { minimumFractionDigits: 2 })}`, 190, finalY + 34, { align: 'right' });
            } else {
                // Official Invoice: Auto-deducts Advance if marked Paid!
                const deductedAdvance = isAdvPaid ? advanceAmt : 0;
                let balanceDue = Math.max(0, totalBudget - deductedAdvance);
                if (currentStatus === 'completed') balanceDue = 0;

                doc.setFont('helvetica', 'normal');
                doc.setTextColor(71, 85, 105);
                doc.text(isAdvPaid ? 'Less: Advance Paid:' : 'Required Advance:', summaryX + 5, finalY + 19);

                doc.setFont('helvetica', 'bold');
                if (isAdvPaid) {
                    doc.setTextColor(16, 185, 129); // Green deduction
                    doc.text(`- Rs. ${deductedAdvance.toLocaleString('en-US', { minimumFractionDigits: 2 })}`, 190, finalY + 19, { align: 'right' });
                } else {
                    doc.setTextColor(217, 119, 6);
                    doc.text(`Rs. ${advanceAmt.toLocaleString('en-US', { minimumFractionDigits: 2 })}`, 190, finalY + 19, { align: 'right' });
                }

                doc.setDrawColor(203, 213, 225);
                doc.line(summaryX + 5, finalY + 25, 190, finalY + 25);

                doc.setFontSize(11.5);
                doc.setTextColor(15, 23, 42);
                doc.text('BALANCE DUE:', summaryX + 5, finalY + 34);
                doc.setTextColor(balanceDue === 0 ? 16 : 220, balanceDue === 0 ? 185 : 38, balanceDue === 0 ? 129 : 38);
                doc.text(`Rs. ${balanceDue.toLocaleString('en-US', { minimumFractionDigits: 2 })}`, 190, finalY + 34, { align: 'right' });
            }

            // 5. Official Bank Transfer Details Box (Left Side next to Summary)
            doc.setFillColor(239, 246, 255); // Soft Blue Box
            doc.setDrawColor(147, 197, 253);
            doc.roundedRect(15, finalY, 95, 42, 2, 2, 'FD');

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(9.5);
            doc.setTextColor(30, 58, 138);
            doc.text('BANK TRANSFER DETAILS:', 20, finalY + 8);

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(9);
            doc.setTextColor(30, 41, 59);
            doc.text('Account Name:', 20, finalY + 15);
            doc.text('Bank:', 20, finalY + 21);
            doc.text('Branch:', 20, finalY + 27);
            doc.text('Account No:', 20, finalY + 33);
            doc.text('Payment Ref:', 20, finalY + 39);

            doc.setFont('helvetica', 'bold');
            doc.text('Lakmal Madhushan Kumara', 48, finalY + 15);
            doc.text('Bank of Ceylon (BOC)', 48, finalY + 21);
            doc.text('Peradeniya', 48, finalY + 27);
            doc.setTextColor(37, 99, 235);
            doc.text('91493785', 48, finalY + 33);
            doc.setTextColor(15, 23, 42);
            doc.text(displayId, 48, finalY + 39);

            // 6. Terms & Instructions Section
            let termsY = finalY + 54;
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(9.5);
            doc.setTextColor(15, 23, 42);
            doc.text('TERMS & PORTAL INSTRUCTIONS:', 15, termsY);

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(8.8);
            doc.setTextColor(71, 85, 105);
            const termsList = isQuote ? [
                `1. This quotation is valid for 7 days (until ${dueDateStr}).`,
                `2. An advance payment of Rs. ${advanceAmt.toLocaleString()} is required to commence work on the project.`,
                `3. Please mention Order No (${displayId}) as the bank transfer remark and send the slip via WhatsApp to +94 76 639 0768.`,
                `4. You can track live project progress and review draft samples anytime on our Customer Portal using Order No: ${displayId}.`
            ] : [
                `1. Final payment is due on or before ${dueDateStr} (within 7 days of invoice date).`,
                `2. Please transfer the Balance Due to the BOC account above using Order No (${displayId}) as the payment reference.`,
                `3. Once completed, all high-resolution final project files are unlocked for instant download on the Customer Portal.`
            ];

            termsList.forEach((line, idx) => {
                doc.text(line, 15, termsY + 7 + (idx * 5.5));
            });

            // 7. Bottom Footer Bar
            doc.setDrawColor(226, 232, 240);
            doc.line(15, 272, 195, 272);

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(9);
            doc.setTextColor(15, 23, 42);
            doc.text('Thank you for choosing Pixel Craft Studio!', 105, 278, { align: 'center' });

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(8);
            doc.setTextColor(100, 116, 139);
            doc.text('This is a computer-generated official document and does not require a physical signature.', 105, 283, { align: 'center' });

            const cleanClient = clientName.replace(/[^a-zA-Z0-9]/g, '_');
            const filePrefix = isQuote ? 'Quotation' : 'Invoice';
            doc.save(`${filePrefix}_${displayId}_${cleanClient}.pdf`);
        }
    </script>
