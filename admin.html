<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Pixel Craft Studio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        :root {
            --primary: #3b82f6;
            --bg-deep: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-deep); color: var(--text-main); }

        /* Login Screen */
        #login-screen { position: fixed; width: 100%; height: 100vh; background: var(--bg-deep); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .login-box { background: var(--card-bg); padding: 40px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
        .login-box input { padding: 12px; width: 100%; margin: 15px 0; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-deep); color: #fff; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; background: var(--primary); color: white; cursor: pointer; font-weight: 600; width: 100%; transition: 0.3s; }
        .btn:hover { background: #2563eb; }
        .btn-success { background: var(--success); }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }

        /* Dashboard */
        #dashboard { display: none; padding: 30px; max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        .stat-card h3 { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 10px; }
        .stat-card .value { font-size: 1.8rem; font-weight: 600; }

        /* Table */
        .table-container { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); overflow-x: auto; padding: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--text-muted); font-weight: 500; font-size: 0.9rem; }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .badge.reviewed { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .badge.awaiting { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .badge.progress { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        
        .action-btn { padding: 6px 12px; font-size: 0.85rem; cursor: pointer; border-radius: 4px; border: 1px solid var(--primary); background: transparent; color: var(--primary); }
        .wa-btn { border-color: #25D366; color: #25D366; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
        .modal-content { background: var(--card-bg); padding: 30px; border-radius: 12px; width: 100%; max-width: 500px; border: 1px solid var(--border); }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .close-modal { cursor: pointer; color: var(--text-muted); font-size: 1.2rem; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: var(--text-muted); }
        .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-deep); color: white; }
        
        .payment-actions { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Pixel Craft Admin</h2>
            <input type="password" id="admin-pass" placeholder="Enter Admin Password">
            <button class="btn" onclick="checkLogin()">Login</button>
            <p id="login-err" style="color: red; margin-top: 10px; display: none; font-size: 0.9rem;">Incorrect Password!</p>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard">
        <div class="header">
            <h2>Admin Dashboard</h2>
            <button class="btn btn-outline" style="width: auto;" onclick="location.reload()">Refresh Data</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Orders</h3>
                <div class="value" id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <h3>Pending Advances</h3>
                <div class="value" id="stat-pending">0</div>
            </div>
            <div class="stat-card">
                <h3>Completed</h3>
                <div class="value" id="stat-completed">0</div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Client / Business</th>
                        <th>Service</th>
                        <th>Status</th>
                        <th>Budget / Advance</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="orders-table-body">
                    <tr><td colspan="5" style="text-align: center;">Loading orders...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Order Management Modal -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-client-name">Manage Order</h3>
                <span class="close-modal" onclick="closeModal()">✖</span>
            </div>
            
            <input type="hidden" id="modal-order-id">
            
            <div class="form-group">
                <label>Project Status</label>
                <select id="modal-status">
                    <option value="reviewed">Reviewed (Link Generation Phase)</option>
                    <option value="awaiting_advance">Awaiting Advance Payment</option>
                    <option value="in_progress">In Progress</option>
                    <option value="completed">Completed</option>
                </select>
            </div>
            
            <div style="display: flex; gap: 15px;">
                <div class="form-group" style="flex: 1;">
                    <label>Total Budget (Rs.)</label>
                    <input type="number" id="modal-budget">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Required Advance (Rs.)</label>
                    <input type="number" id="modal-advance" placeholder="Enter 0 if none">
                </div>
            </div>

            <div class="form-group">
                <label>Timeline / Notes</label>
                <input type="text" id="modal-timeline" placeholder="e.g. 5 Business Days">
            </div>

            <button class="btn" onclick="updateOrder()" id="saveBtn">Save Updates</button>
            
            <button class="btn btn-outline" style="margin-top: 15px;" onclick="copyMagicLink()">🔗 Copy Client Portal Link</button>

            <!-- Payment Action Buttons (Manual Tracking) -->
            <div class="payment-actions">
                <button class="btn btn-success" style="flex: 1; font-size: 0.85rem;" onclick="markAdvancePaid()">Mark Advance Paid</button>
                <button class="btn" style="flex: 1; font-size: 0.85rem;" onclick="markFullyPaid()">Mark Fully Paid</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // IMPORTANT: ADD YOUR FIREBASE DETAILS HERE
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Global variables for UI functions
        window.allOrders = [];
        window.dbRef = db;
        window.updateDocRef = updateDoc;
        window.docRef = doc;

        // Login Function
        window.checkLogin = function() {
            const pass = document.getElementById('admin-pass').value;
            if(pass === "Admin2026") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadOrders();
            } else {
                document.getElementById('login-err').style.display = 'block';
            }
        }

        // Fetch Orders
        async function loadOrders() {
            const tableBody = document.getElementById('orders-table-body');
            tableBody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Fetching data...</td></tr>';
            
            try {
                // Fetching orders ordered by creation time
                const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                window.allOrders = [];
                let html = '';
                let tOrders = 0, pAdvance = 0, comp = 0;

                querySnapshot.forEach((document) => {
                    let data = document.data();
                    data.id = document.id;
                    window.allOrders.push(data);
                    
                    tOrders++;
                    if(data.status === 'awaiting_advance') pAdvance++;
                    if(data.status === 'completed') comp++;

                    let statusClass = 'reviewed';
                    let statusText = 'Reviewed';
                    if(data.status === 'awaiting_advance') { statusClass = 'awaiting'; statusText = 'Awaiting Adv.'; }
                    if(data.status === 'in_progress') { statusClass = 'progress'; statusText = 'In Progress'; }
                    if(data.status === 'completed') { statusClass = 'progress'; statusText = 'Completed'; }

                    // Format WhatsApp Number (remove 0 at start, prepend 94)
                    let rawWa = data.phone.replace(/[^0-9]/g, '');
                    if(rawWa.startsWith('0')) rawWa = '94' + rawWa.substring(1);

                    html += `
                        <tr>
                            <td>
                                <strong>${data.name}</strong><br>
                                <span style="font-size: 0.8rem; color: #94a3b8;">${data.business}</span>
                            </td>
                            <td>${data.service}</td>
                            <td><span class="badge ${statusClass}">${statusText}</span></td>
                            <td>Rs. ${data.budget} / Adv: Rs. ${data.advance}</td>
                            <td>
                                <button class="action-btn" onclick="openModal('${data.id}')">Manage</button>
                                <button class="action-btn wa-btn" onclick="window.open('https://wa.me/${rawWa}', '_blank')">WhatsApp</button>
                            </td>
                        </tr>
                    `;
                });

                document.getElementById('stat-total').innerText = tOrders;
                document.getElementById('stat-pending').innerText = pAdvance;
                document.getElementById('stat-completed').innerText = comp;

                if(html === '') {
                    tableBody.innerHTML = '<tr><td colspan="5" style="text-align: center;">No orders found.</td></tr>';
                } else {
                    tableBody.innerHTML = html;
                }

            } catch (error) {
                console.error("Error fetching orders: ", error);
                tableBody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: red;">Error loading data. Check console.</td></tr>';
            }
        }

        // Open Modal and populate data
        window.openModal = function(id) {
            const order = window.allOrders.find(o => o.id === id);
            if(order) {
                document.getElementById('modal-order-id').value = id;
                document.getElementById('modal-client-name').innerText = order.name + " - Order";
                document.getElementById('modal-status').value = order.status || 'reviewed';
                document.getElementById('modal-budget').value = order.budget || 0;
                document.getElementById('modal-advance').value = order.advance || 0;
                document.getElementById('modal-timeline').value = order.timeline || '';
                
                document.getElementById('orderModal').style.display = 'flex';
            }
        }

        window.closeModal = function() {
            document.getElementById('orderModal').style.display = 'none';
        }

        // Save Updates to Firebase
        window.updateOrder = async function(customStatus = null) {
            const btn = document.getElementById('saveBtn');
            btn.innerText = "Saving...";
            
            const id = document.getElementById('modal-order-id').value;
            const status = customStatus || document.getElementById('modal-status').value;
            const budget = document.getElementById('modal-budget').value;
            const advance = document.getElementById('modal-advance').value;
            const timeline = document.getElementById('modal-timeline').value;

            try {
                const orderRef = window.docRef(window.dbRef, "orders", id);
                await window.updateDocRef(orderRef, {
                    status: status,
                    budget: Number(budget),
                    advance: Number(advance),
                    timeline: timeline
                });
                
                alert("Order Updated Successfully!");
                window.closeModal();
                loadOrders(); // Refresh table
            } catch (error) {
                console.error("Error updating: ", error);
                alert("Update failed!");
            }
            btn.innerText = "Save Updates";
        }

        // Payment Handling Quick Buttons
        window.markAdvancePaid = function() {
            if(confirm("Mark Advance as Paid and set status to 'In Progress'?")) {
                document.getElementById('modal-status').value = "in_progress";
                window.updateOrder("in_progress");
            }
        }

        window.markFullyPaid = function() {
            if(confirm("Mark order as Completed?")) {
                document.getElementById('modal-status').value = "completed";
                window.updateOrder("completed");
            }
        }

        // Magic Link Generator
        window.copyMagicLink = function() {
            const id = document.getElementById('modal-order-id').value;
            // Assumes portal.html is in the same directory as admin.html
            let baseUrl = window.location.href.split('admin.html')[0];
            let magicLink = baseUrl + 'portal.html?id=' + id;
            
            navigator.clipboard.writeText(magicLink).then(() => {
                alert("Client Portal Link Copied!\n\n" + magicLink + "\n\nYou can paste this in WhatsApp.");
            }).catch(err => {
                alert("Failed to copy link. Please manually copy this:\n" + magicLink);
            });
        }
    </script>
</body>
</html>
